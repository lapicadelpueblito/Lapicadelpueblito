<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>La Picá del Pueblito</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --dark: #111; --accent: #7fff00; --accent2: #aaff00;
      --mid: #888; --light: #1c1c1c; --card-bg: #161616; --text: #f0f0f0; --border: #2a2a2a;
    }
    body { font-family: "Jost", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* HEADER */
    header {
      background: #000; padding: 0 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 85px; position: sticky; top: 0; z-index: 100;
      border-bottom: 2px solid var(--accent);
    }
    .logo { font-family: "Cinzel Decorative", sans-serif; font-size: 1.1rem; letter-spacing: 0.08em; color: var(--text); display:flex; align-items:center; gap:0.6rem; }
    .logo span { color: var(--accent); }
    .logo img { height:46px; width:46px; object-fit:contain; border-radius:50%; }
    nav a { color: var(--mid); text-decoration: none; margin-left: 1.5rem; font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; transition: color 0.2s; }
    nav a:hover { color: var(--accent); }

    /* HERO */
    .hero { background: #000; padding: 4rem 1.5rem 3.5rem; text-align: center; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
    .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(127,255,0,0.07) 0%, transparent 70%); }
    .hero-content { position: relative; z-index: 1; }
    .hero-logo { width:170px; height:170px; object-fit:contain; border-radius:50%; margin-bottom:1.2rem; filter:drop-shadow(0 0 24px rgba(127,255,0,0.45)); }
    .hero-tag { display:inline-block; border:1px solid var(--accent); color:var(--accent); font-size:0.65rem; letter-spacing:0.25em; text-transform:uppercase; padding:0.25rem 1rem; margin-bottom:1.2rem; }
    .hero h1 { font-family:"Cinzel Decorative",sans-serif; font-size:clamp(3rem,10vw,6rem); line-height:0.95; margin-bottom:0.6rem; letter-spacing:0.04em; }
    .hero h1 span { color:var(--accent); }
    .hero p { font-size:0.82rem; color:var(--mid); font-weight:300; letter-spacing:0.12em; text-transform:uppercase; margin-bottom:2rem; }
    .hero-btn { display:inline-block; background:var(--accent); color:#000; padding:0.7rem 2.2rem; font-family:"Cinzel Decorative",sans-serif; font-size:1rem; letter-spacing:0.15em; text-transform:uppercase; text-decoration:none; transition:background 0.2s,transform 0.2s; }
    .hero-btn:hover { background:var(--accent2); transform:translateY(-2px); }

    /* CATEGORIES */
    .categories { display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap; padding:2rem 1.5rem 0.8rem; background:var(--dark); }
    .cat-btn { background:transparent; border:1px solid #333; color:var(--mid); padding:0.4rem 1.1rem; font-family:"Jost",sans-serif; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; transition:all 0.2s; border-radius:2px; }
    .cat-btn.active, .cat-btn:hover { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }

    /* SECTION TITLE */
    .section-title { text-align:center; padding:1.5rem 1.5rem 1.2rem; background:var(--dark); }
    .section-title h2 { font-family:"Cinzel Decorative",sans-serif; font-size:2rem; color:var(--text); letter-spacing:0.08em; }
    .section-title p { font-size:0.78rem; color:var(--mid); margin-top:0.3rem; font-weight:300; }

    /* GRID */
    .products { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:1px; background:var(--border); max-width:1200px; margin:0 auto; }
    .card { background:var(--card-bg); transition:background 0.2s; cursor:pointer; animation:fadeUp 0.4s ease both; }
    .card:hover { background:#1f1f1f; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    .card-img { width:100%; height:160px; display:flex; align-items:center; justify-content:center; font-size:3.2rem; background:var(--light); border-bottom:1px solid var(--border); overflow:hidden; position:relative; }
    .card-img img { width:100%; height:100%; object-fit:cover; }
    .card-img .emoji-fallback { font-size:3.2rem; }
    .card-body { padding:0.9rem 1rem 1rem; }
    .card-cat { font-size:0.6rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:0.25rem; }
    .card-name { font-family:"Cinzel Decorative",sans-serif; font-size:1.1rem; letter-spacing:0.04em; margin-bottom:0.3rem; color:var(--text); }
    .card-desc { font-size:0.75rem; color:var(--mid); font-weight:300; line-height:1.5; margin-bottom:0.8rem; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; }
    .price { font-family:"Cinzel Decorative",sans-serif; font-size:1.15rem; color:var(--accent); letter-spacing:0.05em; }
    .add-btn { background:transparent; color:var(--accent); border:1px solid var(--accent); padding:0.3rem 0.8rem; font-family:"Jost",sans-serif; font-size:0.72rem; letter-spacing:0.08em; cursor:pointer; transition:all 0.2s; }
    .add-btn:hover { background:var(--accent); color:#000; font-weight:600; }

    /* PRODUCT DETAIL MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:500; display:none; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--dark); max-width:700px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid var(--border); position:relative; animation:fadeUp 0.3s ease; }
    .modal-close { position:absolute; top:1rem; right:1rem; background:#000; border:1px solid #333; color:var(--mid); width:34px; height:34px; border-radius:50%; font-size:1rem; cursor:pointer; z-index:10; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
    .modal-close:hover { color:var(--text); border-color:var(--accent); }

    /* GALLERY */
    .gallery-main { width:100%; min-height:300px; max-height:520px; background:#000; display:flex; align-items:center; justify-content:center; font-size:6rem; overflow:hidden; position:relative; }
    .gallery-main img { width:100%; height:auto; max-height:520px; object-fit:contain; }
    .gallery-main .emoji-main { font-size:6rem; }
    .gallery-thumbs { display:flex; gap:4px; padding:4px; background:#000; }
    .thumb { width:70px; height:70px; cursor:pointer; border:2px solid transparent; overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:var(--light); font-size:1.8rem; transition:border-color 0.2s; }
    .thumb.active { border-color:var(--accent); }
    .thumb img { width:100%; height:100%; object-fit:cover; }

    .modal-body { padding:1.5rem; }
    .modal-cat { font-size:0.65rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:0.4rem; }
    .modal-name { font-family:"Cinzel Decorative",sans-serif; font-size:2rem; letter-spacing:0.05em; margin-bottom:0.8rem; }
    .modal-desc { font-size:0.88rem; color:#bbb; line-height:1.7; margin-bottom:1.2rem; font-weight:300; }
    .modal-price { font-family:"Cinzel Decorative",sans-serif; font-size:2.2rem; color:var(--accent); margin-bottom:1.2rem; }
    .modal-add { width:100%; background:var(--accent); color:#000; border:none; padding:0.9rem; font-family:"Cinzel Decorative",sans-serif; font-size:1.1rem; letter-spacing:0.15em; cursor:pointer; transition:background 0.2s; }
    .modal-add:hover { background:var(--accent2); }

    /* CART */
    .cart-float { position:fixed; bottom:6.5rem; right:1.5rem; background:var(--accent); color:#000; border:none; width:56px; height:56px; border-radius:50%; font-size:1.3rem; cursor:pointer; box-shadow:0 4px 20px rgba(127,255,0,0.35); display:flex; align-items:center; justify-content:center; transition:transform 0.2s; z-index:200; }
    .cart-float:hover { transform:scale(1.1); }
    .cart-badge { position:absolute; top:-3px; right:-3px; background:#000; color:var(--accent); font-size:0.6rem; font-weight:700; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid var(--accent); }
    .cart-panel { position:fixed; top:0; right:0; width:min(360px,100vw); height:100vh; background:#0d0d0d; border-left:2px solid var(--accent); z-index:600; transform:translateX(100%); transition:transform 0.3s ease; display:flex; flex-direction:column; }
    .cart-panel.open { transform:translateX(0); }
    .cart-header { padding:1.1rem 1.4rem; background:#000; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .cart-header h3 { font-family:"Cinzel Decorative",sans-serif; font-size:1.2rem; letter-spacing:0.1em; color:var(--accent); }
    .close-cart { background:none; border:none; color:var(--mid); font-size:1.2rem; cursor:pointer; }
    .close-cart:hover { color:var(--text); }
    .cart-items { flex:1; overflow-y:auto; padding:0.8rem 1.2rem; }
    .cart-item { display:flex; gap:0.8rem; align-items:center; padding:0.7rem 0; border-bottom:1px solid var(--border); }
    .cart-item-icon { font-size:1.6rem; width:40px; height:40px; display:flex; align-items:center; justify-content:center; background:var(--light); overflow:hidden; flex-shrink:0; }
    .cart-item-icon img { width:100%; height:100%; object-fit:cover; }
    .cart-item-info { flex:1; }
    .cart-item-name { font-family:"Cinzel Decorative",sans-serif; font-size:0.95rem; letter-spacing:0.04em; }
    .cart-item-price { font-size:0.78rem; color:var(--mid); }
    .remove-item { background:none; border:none; color:#555; cursor:pointer; font-size:0.9rem; }
    .remove-item:hover { color:#ff4444; }
    .cart-empty { text-align:center; padding:3rem 1rem; color:var(--mid); font-size:0.85rem; font-weight:300; }
    .cart-footer { padding:1rem 1.2rem; border-top:1px solid var(--border); }
    .cart-total { display:flex; justify-content:space-between; font-family:"Cinzel Decorative",sans-serif; font-size:1.2rem; letter-spacing:0.06em; margin-bottom:0.8rem; color:var(--accent); }
    .checkout-btn { width:100%; background:var(--accent); color:#000; border:none; padding:0.8rem; font-family:"Cinzel Decorative",sans-serif; font-size:1rem; letter-spacing:0.15em; cursor:pointer; transition:background 0.2s; }
    .checkout-btn:hover { background:var(--accent2); }
    .clear-cart-btn { width:100%; background:#333; color:#fff; border:none; padding:0.6rem; font-family:"Cinzel Decorative",sans-serif; font-size:0.8rem; letter-spacing:0.1em; cursor:pointer; transition:background 0.2s; margin-top:0.5rem; }
    .clear-cart-btn:hover { background:#555; }

    /* CARRUSEL */
    .carrusel-wrap {
      background: #000;
      padding: 1.5rem 0;
      border-top: 1px solid #2a2a2a;
      border-bottom: 1px solid #2a2a2a;
      overflow: hidden;
      position: relative;
    }
    .carrusel-titulo {
      text-align: center;
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      color: #7fff00;
      text-transform: uppercase;
      margin-bottom: 1rem;
      font-family: "Cinzel Decorative", serif;
    }
    .carrusel-outer {
      overflow: hidden;
      position: relative;
    }
    .carrusel-outer::before,
    .carrusel-outer::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 50px;
      z-index: 2;
      pointer-events: none;
    }
    .carrusel-outer::before { left: 0; background: linear-gradient(to right, #000, transparent); }
    .carrusel-outer::after  { right: 0; background: linear-gradient(to left, #000, transparent); }
    .carrusel-inner {
      display: flex;
      gap: 12px;
      width: max-content;
      animation: mover 35s linear infinite;
    }
    .carrusel-inner:hover { animation-play-state: paused; }
    @keyframes mover {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .carrusel-card {
      width: 150px;
      flex-shrink: 0;
      background: #161616;
      border: 1px solid #2a2a2a;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .carrusel-card:hover { border-color: #7fff00; transform: translateY(-3px); }
    .carrusel-card-img {
      width: 150px;
      height: 120px;
      overflow: hidden;
      background: #1c1c1c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .carrusel-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .carrusel-card-info { padding: 0.5rem 0.6rem; }
    .carrusel-card-nombre {
      font-size: 0.58rem;
      color: #ddd;
      font-family: "Jost", sans-serif;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.2rem;
    }
    .carrusel-card-precio {
      font-size: 0.7rem;
      color: #7fff00;
      font-family: "Cinzel Decorative", serif;
    }

    /* CONTACTO */
    .contacto { background:#000; color:var(--text); padding:3rem 1.5rem; text-align:center; border-top:2px solid var(--accent); }
    .contacto h3 { font-family:"Cinzel Decorative",sans-serif; font-size:1.8rem; letter-spacing:0.08em; margin-bottom:0.4rem; }
    .contacto p { font-size:0.82rem; color:var(--mid); font-weight:300; margin-bottom:1.2rem; }
    .wa-btn { display:inline-block; background:var(--accent); color:#000; padding:0.7rem 2rem; font-family:"Cinzel Decorative",sans-serif; font-size:1rem; letter-spacing:0.15em; text-decoration:none; transition:background 0.2s; }
    .wa-btn:hover { background:var(--accent2); }
    footer { background:#000; color:#333; text-align:center; padding:1.2rem; font-size:0.7rem; letter-spacing:0.08em; border-top:1px solid #1a1a1a; }

    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:250; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .overlay.show { opacity:1; pointer-events:all; }
    .toast { position:fixed; bottom:5rem; right:1.5rem; background:var(--accent); color:#000; padding:0.5rem 1.1rem; font-size:0.78rem; font-weight:600; z-index:700; opacity:0; transform:translateY(8px); transition:all 0.25s; pointer-events:none; }
    .toast.show { opacity:1; transform:translateY(0); }

    @media(max-width:600px){
      nav{display:none;}
      .products{grid-template-columns:repeat(2,1fr);}
      .card-img{height:120px;font-size:2.5rem;}
      .gallery-main{height:220px;}
    }
  </style>
</head>
